openapi: 3.0.3

info:
  title: HomeJira API
  description: |
    Household task management API — Jira for home.

    ## Authentication
    Most endpoints require a **Bearer JWT** obtained from `/api/v1/auth/login` or `/api/v1/auth/register`.
    Pass it as `Authorization: Bearer <token>` on every protected request.

    Authentication uses a **username** and 4-digit **mPIN**.
    Tokens are valid for **7 days**. Call `POST /api/v1/auth/refresh` to reissue a fresh token
    (e.g. after your join request is approved and your `household_id` changes).

    ## Guest mode
    The frontend supports a localStorage-only guest mode. Guest users never call this API.
  version: 1.0.0
  contact:
    url: https://homejira.app

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://homejira-staging.up.railway.app
    description: Staging
  - url: https://homejira.up.railway.app
    description: Production

tags:
  - name: System
    description: Health and configuration
  - name: Auth
    description: Username + mPIN authentication
  - name: Members
    description: Member profiles and coins
  - name: Tasks
    description: Task CRUD, comments, and activity
  - name: Groceries
    description: Grocery list CRUD
  - name: Households
    description: Household management, join flow, and invite links

security:
  - bearerAuth: []

# ─────────────────────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Member:
      type: object
      properties:
        id: { type: string, format: uuid, example: "3fa85f64-5717-4562-b3fc-2c963f66afa6" }
        name: { type: string, example: "Alice" }
        avatar: { type: string, example: "A" }
        color: { type: string, example: "#6366f1" }
        username: { type: string, example: "alice_home" }
        household_id: { type: string, format: uuid, nullable: true }
        role: { type: string, enum: [admin, member], example: "member" }
        created_at: { type: string, format: date-time }

    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: "Fix hallway light" }
        notes: { type: string, example: "Check the spare bulbs first" }
        category: { type: string, enum: [chore, errand, repair] }
        priority: { type: string, enum: [urgent, high, normal] }
        assignee_id: { type: string, format: uuid, nullable: true }
        household_id: { type: string, format: uuid }
        done: { type: boolean }
        done_at: { type: string, format: date-time, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        quantity: { type: string, nullable: true, example: "2 bulbs", description: "Optional quantity/details string." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        assignee:
          allOf: [{ $ref: '#/components/schemas/Member' }]
          nullable: true
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }

    Comment:
      type: object
      properties:
        id:         { type: string, format: uuid }
        task_id:    { type: string, format: uuid }
        author_id:  { type: string, format: uuid }
        body:       { type: string }
        created_at: { type: string, format: date-time }
        author:
          allOf: [{ $ref: '#/components/schemas/Member' }]
          nullable: true

    Activity:
      type: object
      properties:
        id:         { type: string, format: uuid }
        task_id:    { type: string, format: uuid }
        actor_id:   { type: string, format: uuid, nullable: true }
        kind:
          type: string
          enum:
            - created
            - completed
            - reopened
            - assigned
            - priority_changed
            - category_changed
            - title_changed
            - notes_changed
            - due_set
            - due_cleared
          example: "completed"
        meta: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        actor:
          allOf: [{ $ref: '#/components/schemas/Member' }]
          nullable: true

    Grocery:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: "Milk" }
        quantity: { type: string, nullable: true, example: "2 litres" }
        notes: { type: string, example: "2% fat" }
        done: { type: boolean }
        done_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        household_id: { type: string, format: uuid }
        assignee_id: { type: string, format: uuid, nullable: true }
        assignee:
          allOf: [{ $ref: '#/components/schemas/Member' }]
          nullable: true

    Household:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string, example: "Smith Family" }
        kind:       { type: string, enum: [home, group], example: "home" }
        join_code:  { type: string, example: "XK9P2F" }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    JoinRequest:
      type: object
      properties:
        id:           { type: string, format: uuid }
        household_id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        status:       { type: string, enum: [pending, approved, rejected] }
        created_at:   { type: string, format: date-time }
        decided_at:   { type: string, format: date-time, nullable: true }
        decided_by:   { type: string, format: uuid, nullable: true }
        note:         { type: string, nullable: true }
        requester:
          allOf: [{ $ref: '#/components/schemas/Member' }]
          nullable: true
        household:
          allOf: [{ $ref: '#/components/schemas/Household' }]
          nullable: true

    Invite:
      type: object
      properties:
        id:            { type: string, format: uuid }
        household_id:  { type: string, format: uuid }
        invited_phone: { type: string, description: "Direct invite target. The field name is kept for backward compatibility." }
        invited_name:  { type: string }
        status:        { type: string, enum: [pending, accepted, rejected, expired] }
        created_by:    { type: string, format: uuid }
        created_at:    { type: string, format: date-time }

    InviteLink:
      type: object
      properties:
        id:           { type: string, format: uuid }
        household_id: { type: string, format: uuid }
        created_by:   { type: string, format: uuid }
        token:        { type: string }
        expires_at:   { type: string, format: date-time }
        created_at:   { type: string, format: date-time }

    CoinTransaction:
      type: object
      properties:
        id:         { type: string, format: uuid }
        member_id:  { type: string, format: uuid }
        amount:     { type: integer }
        reason:     { type: string }
        meta:       { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    PublicReferrer:
      type: object
      properties:
        name: { type: string, example: "Alice" }
        avatar: { type: string, example: "A" }
        color: { type: string, example: "#6366f1" }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: "resource not found" }

  responses:
    BadRequest:
      description: Invalid request body, query, or path parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, or unauthorized JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated caller lacks required household access
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── System ─────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [System]
      summary: Health check
      description: Returns server status, DB connectivity, commit SHA, uptime, and build time. Used by deployment pipelines.
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:      { type: string, example: "ok" }
                  env:         { type: string, example: "production" }
                  commit:      { type: string, example: "a1b2c3d" }
                  built_at:    { type: string, example: "2026-03-14T00:00:00Z" }
                  uptime_sec:  { type: integer, example: 3600 }
                  db:          { type: string, example: "ok" }

  /api/v1/config:
    get:
      tags: [System]
      summary: Feature flags
      description: Returns all feature flags. Used by the frontend to conditionally show/hide features.
      security: []
      responses:
        '200':
          description: Feature flags map
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: object
                    additionalProperties: { type: boolean }
                    example: { "coins": false, "referrals": false }

  /api/v1/events:
    get:
      tags: [System]
      summary: SSE live-sync stream
      description: |
        Server-Sent Events stream. Sends a keepalive comment roughly every 20 seconds and a
        `data: update` event whenever the member's household data changes.

        Because `EventSource` cannot set `Authorization` headers, authenticate via the
        `?token=<jwt>` query parameter instead.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: JWT bearer token
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                example: ": ping\n\ndata: update\n\n"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Auth ───────────────────────────────────────────────────────────────────

  /api/v1/auth/check-username:
    post:
      tags: [Auth]
      summary: Check if a username is registered
      description: Rate-limited per IP. Returns whether the username is already registered so the frontend can route to Login vs Register.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, example: "alice_home" }
      responses:
        '200':
          description: Username status
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with username + mPIN
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, mpin]
              properties:
                username: { type: string, example: "alice_home" }
                mpin: { type: string, minLength: 4, maxLength: 4, example: "1234" }
      responses:
        '200':
          description: JWT token and member profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:  { type: string }
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or mPIN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new member
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, name, mpin]
              properties:
                username:       { type: string, example: "alice_home" }
                name:           { type: string, example: "Alice" }
                avatar:         { type: string, example: "A", description: "Optional avatar string used by the UI." }
                mpin:           { type: string, minLength: 4, maxLength: 4, example: "1234" }
                referral_token: { type: string, description: "Optional referral token" }
      responses:
        '201':
          description: JWT token and new member profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:  { type: string }
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      description: |
        Reissues a fresh JWT reflecting the current DB state.
        Call this after a household join request is approved so the new `household_id` is embedded in the token.
      responses:
        '200':
          description: Fresh token and updated member profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:  { type: string }
                  member: { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/mpin:
    patch:
      tags: [Auth]
      summary: Change mPIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_mpin, new_mpin]
              properties:
                current_mpin: { type: string, minLength: 4, maxLength: 4, example: "1234" }
                new_mpin:     { type: string, minLength: 4, maxLength: 4, example: "5678" }
      responses:
        '204':
          description: mPIN updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid current mPIN or bad JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ── Members ────────────────────────────────────────────────────────────────

  /api/v1/members:
    get:
      tags: [Members]
      summary: List household members
      description: Returns all members of the caller's household. Returns empty array if the caller has no household.
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/members/me:
    patch:
      tags: [Members]
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:   { type: string, example: "Alice" }
                avatar: { type: string, example: "A" }
                color:  { type: string, example: "#6366f1" }
      responses:
        '200':
          description: Updated member profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/members/me/coins:
    get:
      tags: [Members]
      summary: Get my coin balance and transaction history
      responses:
        '200':
          description: Coin balance and transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: integer
                    example: 150
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/CoinTransaction' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/members/me/referral-link:
    get:
      tags: [Members]
      summary: Get or create my referral link
      description: Creates a referral token if one does not already exist for the member.
      responses:
        '200':
          description: Referral token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "ABCD1234EFGH" }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/members/{id}:
    get:
      tags: [Members]
      summary: Get a member by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Member profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Tasks ──────────────────────────────────────────────────────────────────

  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      description: Returns tasks for the caller's household, optionally filtered.
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [chore, errand, repair] }
        - name: done
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string }
          description: Full-text search on title and notes
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Tasks]
      summary: Create a task
      description: Caller must be in a household. `household_id` is resolved on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, priority]
              properties:
                title:       { type: string, example: "Fix hallway light" }
                notes:       { type: string, example: "Check the spare bulbs first" }
                category:    { type: string, enum: [chore, errand, repair] }
                priority:    { type: string, enum: [urgent, high, normal] }
                assignee_id: { type: string, format: uuid, nullable: true }
                due_at:      { type: string, format: date-time, nullable: true }
                quantity:    { type: string, nullable: true, example: "2 bulbs" }
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: '#/components/schemas/Task' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Task with comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: '#/components/schemas/Task' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Tasks]
      summary: Update a task (partial)
      description: All fields are optional. Send only the fields you want to change.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:        { type: string }
                notes:        { type: string }
                category:     { type: string, enum: [chore, errand, repair] }
                priority:     { type: string, enum: [urgent, high, normal] }
                assignee_id:  { type: string, format: uuid, nullable: true }
                done:         { type: boolean }
                due_at:       { type: string, format: date-time, nullable: true }
                clear_due_at: { type: boolean, description: "Set to true to remove the due date" }
                quantity:     { type: string, nullable: true }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: '#/components/schemas/Task' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Task deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tasks/{id}/comments:
    post:
      tags: [Tasks]
      summary: Add a comment to a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:      { type: string, example: "On it!" }
      responses:
        '201':
          description: Created comment
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: '#/components/schemas/Comment' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/tasks/{id}/activity:
    get:
      tags: [Tasks]
      summary: Get activity history for a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Activity log
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items: { $ref: '#/components/schemas/Activity' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Groceries ──────────────────────────────────────────────────────────────

  /api/v1/groceries:
    get:
      tags: [Groceries]
      summary: List groceries
      description: Returns grocery items for the caller's household. If the JWT does not yet contain `household_id`, refresh the token first.
      parameters:
        - name: done
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string }
          description: Full-text search on title and notes
      responses:
        '200':
          description: List of groceries
          content:
            application/json:
              schema:
                type: object
                properties:
                  groceries:
                    type: array
                    items: { $ref: '#/components/schemas/Grocery' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Groceries]
      summary: Create a grocery item
      description: Caller must be in a household. `household_id` is taken from the JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, example: "Milk" }
                quantity: { type: string, nullable: true, example: "2 litres" }
                notes: { type: string, example: "2% fat" }
                assignee_id: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Created grocery item
          content:
            application/json:
              schema:
                type: object
                properties:
                  grocery: { $ref: '#/components/schemas/Grocery' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/groceries/{id}:
    get:
      tags: [Groceries]
      summary: Get a grocery item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Grocery item
          content:
            application/json:
              schema:
                type: object
                properties:
                  grocery: { $ref: '#/components/schemas/Grocery' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Groceries]
      summary: Update a grocery item
      description: All fields are optional. Send only the fields you want to change.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                quantity: { type: string, nullable: true }
                notes: { type: string }
                done: { type: boolean }
                assignee_id: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Updated grocery item
          content:
            application/json:
              schema:
                type: object
                properties:
                  grocery: { $ref: '#/components/schemas/Grocery' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Groceries]
      summary: Delete a grocery item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Grocery item deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Households ─────────────────────────────────────────────────────────────

  /api/v1/households/me:
    get:
      tags: [Households]
      summary: Get my household
      responses:
        '200':
          description: Current household, or `null` if the caller has not joined one yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  household:
                    allOf: [{ $ref: '#/components/schemas/Household' }]
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/households:
    post:
      tags: [Households]
      summary: Create a household
      description: Creates a new household and makes the caller its admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string, example: "Smith Family" }
                kind: { type: string, enum: [home, group] }
      responses:
        '201':
          description: New household and updated member (now admin)
          content:
            application/json:
              schema:
                type: object
                properties:
                  household: { $ref: '#/components/schemas/Household' }
                  member:    { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Households]
      summary: Delete my household
      description: Admin only. Removes the household and clears all members from it.
      responses:
        '204':
          description: Household deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/households/leave:
    post:
      tags: [Households]
      summary: Leave my household
      description: Cannot leave if you are the sole admin.
      responses:
        '200':
          description: Updated member (household_id is now null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/households/join-by-code:
    post:
      tags: [Households]
      summary: Request to join a household by 6-character join code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "XK9P2F", minLength: 6, maxLength: 6 }
      responses:
        '201':
          description: Join request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:   { $ref: '#/components/schemas/JoinRequest' }
                  household: { $ref: '#/components/schemas/Household' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invalid join code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '409':
          description: Already in a household or request already pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/households/invite-link:
    post:
      tags: [Households]
      summary: Create a shareable invite link
      description: Admin only. Returns a token valid for 7 days.
      responses:
        '201':
          description: Invite link token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:     { type: string }
                  household: { $ref: '#/components/schemas/Household' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/households/link/{token}:
    get:
      tags: [Households]
      summary: Resolve an invite link token (public)
      description: Returns household info before the user logs in, so they know what they are joining.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Household info
          content:
            application/json:
              schema:
                type: object
                properties:
                  household: { $ref: '#/components/schemas/Household' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/households/link/{token}/join:
    post:
      tags: [Households]
      summary: Join a household via invite link
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated member (now part of household)
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invalid or expired token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/households/members/{id}/remove:
    post:
      tags: [Households]
      summary: Remove a member from the household
      description: Admin only. Cannot remove yourself.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Removed member (household_id is now null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/households/members/{id}/promote:
    post:
      tags: [Households]
      summary: Promote a member to admin
      description: Admin only. Idempotent — promoting an existing admin is a no-op error.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Promoted member
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/households/requests:
    get:
      tags: [Households]
      summary: List pending join requests
      description: Admin only. Returns all pending join requests for the caller's household.
      responses:
        '200':
          description: Pending join requests (with requester embedded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/JoinRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/households/requests/mine:
    get:
      tags: [Households]
      summary: Get my pending join request
      responses:
        '200':
          description: My current pending request (null if none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    allOf: [{ $ref: '#/components/schemas/JoinRequest' }]
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/households/requests/{id}/approve:
    post:
      tags: [Households]
      summary: Approve a join request
      description: Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Approved request and updated member
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/JoinRequest' }
                  member:  { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/households/requests/{id}/reject:
    post:
      tags: [Households]
      summary: Reject a join request
      description: Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rejected request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/JoinRequest' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/households/requests/{id}/cancel:
    post:
      tags: [Households]
      summary: Cancel my pending join request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Request cancelled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/households/invites:
    post:
      tags: [Households]
      summary: Invite a member directly
      description: Admin only. Creates a direct invite keyed by the `phone` field used by the current implementation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "alice_home", description: "Invite target identifier. Despite the field name, current clients send the invitee username here." }
                name:  { type: string, example: "Bob", description: "Optional display name hint" }
      responses:
        '201':
          description: Created invite
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/households/invites/me:
    get:
      tags: [Households]
      summary: List invites addressed to me
      description: Uses the authenticated username from the JWT. A `username` query parameter is also accepted as a fallback.
      parameters:
        - name: username
          in: query
          required: false
          schema: { type: string }
          description: Optional fallback when the JWT does not include a username claim.
      responses:
        '200':
          description: Pending invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/households/invites/{id}/accept:
    post:
      tags: [Households]
      summary: Accept a household invite
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Accepted invite and updated member
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/households/invites/{id}/reject:
    post:
      tags: [Households]
      summary: Reject a household invite
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rejected invite
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/referral/{token}:
    get:
      tags: [Members]
      summary: Resolve a referral token to a public profile
      description: Public endpoint. Returns the referrer's public profile to display on the referral landing page.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Referrer's public profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  referrer: { $ref: '#/components/schemas/PublicReferrer' }
        '404':
          $ref: '#/components/responses/NotFound'
