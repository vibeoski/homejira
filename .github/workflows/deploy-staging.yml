name: Deploy to Staging

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  deploy:
    name: Deploy to Railway staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trigger Railway staging redeploy
        run: |
          curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            --data-raw '{"query":"mutation { serviceInstanceRedeploy(environmentId: \"69042cbe-48cf-4e8f-8dda-8d85d489b16f\", serviceId: \"35dfbdfb-5364-427f-92a8-edc7cf1850af\") }"}'

      - name: Wait for staging to serve new commit
        run: |
          SHA="${{ github.sha }}"
          URL="https://homejira-staging.up.railway.app/health"
          echo "Waiting for commit $SHA to be live on staging..."
          for i in $(seq 1 20); do
            LIVE=$(curl -sf "$URL" | jq -r '.commit' 2>/dev/null || echo "")
            if [ "$LIVE" = "$SHA" ]; then
              echo "Staging is live with commit $SHA"
              exit 0
            fi
            echo "  attempt $i/20: got '$LIVE', waiting 15s..."
            sleep 15
          done
          echo "Timed out waiting for staging deploy"
          exit 1

  smoke-test:
    name: Smoke tests — staging
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6

      - name: Run smoke tests
        id: smoke
        run: |
          bash qa/test-auth-tasks.sh

      - name: Open issue on smoke test failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Smoke test failure: ${context.sha.slice(0,7)} — ${context.payload.head_commit?.message?.split('\n')[0] ?? 'unknown'}`,
              body: `Staging smoke tests failed after deploying commit ${context.sha}.\n\n**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n**Commit:** ${context.sha}`,
              labels: ['blocker'],
            })
