name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Railway staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trigger Railway staging deploy
        run: curl -sf -X POST "${{ secrets.RAILWAY_DEPLOY_WEBHOOK }}"

      - name: Wait for staging to serve new commit
        run: |
          SHA="${{ github.sha }}"
          URL="https://homejira-staging.up.railway.app/health"
          echo "Waiting for commit $SHA to be live on staging..."
          for i in $(seq 1 20); do
            LIVE=$(curl -sf "$URL" | jq -r '.commit' 2>/dev/null || echo "")
            if [ "$LIVE" = "$SHA" ]; then
              echo "Staging is live with commit $SHA"
              exit 0
            fi
            echo "  attempt $i/20: got '$LIVE', waiting 15s..."
            sleep 15
          done
          echo "Timed out waiting for staging deploy"
          exit 1

  smoke-test:
    name: Smoke tests — staging
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6

      - name: Run smoke tests
        id: smoke
        run: |
          BASE="https://homejira-staging.up.railway.app/api/v1"

          fail() { echo "FAIL: $1"; exit 1; }
          check_status() {
            local STATUS="$1" EXPECTED="$2" NAME="$3"
            if [ "$STATUS" != "$EXPECTED" ]; then
              fail "$NAME returned HTTP $STATUS (expected $EXPECTED)"
            fi
            echo "  OK: $NAME"
          }

          # 1. Health check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://homejira-staging.up.railway.app/health")
          check_status "$STATUS" "200" "GET /health"

          # 2. Config endpoint (public)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/config")
          check_status "$STATUS" "200" "GET /api/v1/config"

          # 3. Login
          RESP=$(curl -sf -X POST "$BASE/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","mpin":"1234"}') || fail "POST /auth/login failed"
          TOKEN=$(echo "$RESP" | jq -r '.token')
          [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ] && fail "No token in login response"
          echo "  OK: POST /auth/login"

          # 4. List members
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$BASE/members/")
          check_status "$STATUS" "200" "GET /members/"

          # 5. List tasks
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$BASE/tasks/")
          check_status "$STATUS" "200" "GET /tasks/"

          # 6. List groceries
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$BASE/groceries/")
          check_status "$STATUS" "200" "GET /groceries/"

          # 7. My household
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$BASE/households/me")
          [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ] || fail "GET /households/me returned HTTP $STATUS"
          echo "  OK: GET /households/me"

          # 8. Auth refresh
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $TOKEN" "$BASE/auth/refresh")
          check_status "$STATUS" "200" "POST /auth/refresh"

          echo ""
          echo "All smoke tests passed."

      - name: Open issue on smoke test failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Smoke test failure: ${context.sha.slice(0,7)} — ${context.payload.head_commit?.message?.split('\n')[0] ?? 'unknown'}`,
              body: `Staging smoke tests failed after deploying commit ${context.sha}.\n\n**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n**Commit:** ${context.sha}`,
              labels: ['blocker'],
            })
