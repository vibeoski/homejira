name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  backend:
    name: Backend — build, vet, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test ./internal/service/... -coverprofile=coverage.out -covermode=atomic

      - name: Enforce 80% coverage
        run: |
          RAW=$(go tool cover -func=coverage.out | grep "^total" | awk '{print $3}' | tr -d '%')
          INT=${RAW%.*}
          echo "Coverage: ${RAW}%"
          if [ "$INT" -lt 80 ]; then
            echo "ERROR: Coverage ${RAW}% is below the required 80%."
            exit 1
          fi

  frontend:
    name: Frontend — build, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
